[project]
name = "flaky-anything"
version = "0.0.1"
description = "Your flaky test isn't random. Find why it fails, get a deterministic repro, and a verified fix."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yasas", email = "you@example.com" }]
keywords = ["pytest", "flaky tests", "testing", "ci", "agents", "debugging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pytest>=7.4",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "time-machine>=2.14",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]

[project.scripts]
flaky-anything = "flaky_anything.cli:run"

# Not auto-registered as pytest11 on purpose: the trial plugin must only be active inside
# our trial subprocesses (loaded explicitly with `-p flaky_anything.trial_plugin`).

[project.urls]
Homepage = "https://github.com/Yasas-Sri/flaky-anything"
Issues = "https://github.com/Yasas-Sri/flaky-anything/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flaky_anything"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "syrupy>=4",        # snapshot tests for report output
  "tomli>=2; python_version < '3.11'",  # read ground_truth.toml on 3.10 (D10)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/corpus", ".flaky-anything", ".git", ".venv"]
markers = ["e2e: end-to-end tests against the flaky corpus (slower)"]
addopts = "-m 'not e2e' -p no:randomly"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/corpus/project"]
force-exclude = true  # also when the format-on-save hook passes a corpus file path explicitly

[tool.ruff.format]
exclude = ["*.md"]  # ponytail: docs code blocks are illustrative, keep their alignment

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
python_version = "3.10"
packages = ["flaky_anything"]
mypy_path = "src"
